name: Verify Math Studio

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - run: julia --project=julia-wasm -e 'using Pkg; Pkg.instantiate()'
      - run: npm run wasm:build
      - run: npm run wasm:verify
      - run: npm test
      - run: npm run build
