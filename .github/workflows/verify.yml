name: Verify Math Studio

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test scripts/julia-process.test.mjs
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - run: npm run build
      - run: npm run wasm:verify
      - run: npm test
      # Temporary PoC output: download this to run locally if Julia crashes.
      - uses: actions/upload-artifact@v4
        with:
          name: julia-wasm-logistic-step
          path: public/julia-wasm/logistic_step.wasm
          if-no-files-found: error
          retention-days: 14
